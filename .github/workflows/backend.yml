name: Deploy backend

# Rebuilds the backend image in ACR and rolls the Container App to it.
# Manual trigger (Run workflow) — the initial deploy is done by
# infra/deploy-containerapp.sh from your machine / Codespace.
#
# Requires repo secret AZURE_CREDENTIALS — create it with:
#   az ad sp create-for-rbac --name bromog-ci --role contributor \
#     --scopes /subscriptions/<sub-id>/resourceGroups/bromog-rg --sdk-auth
# then paste the JSON output into the secret.

on:
  workflow_dispatch:

env:
  RESOURCE_GROUP: bromog-rg
  ACR_NAME: bromogacr0851824714
  APP_NAME: bromog

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build image in ACR
        run: az acr build -r ${{ env.ACR_NAME }} -t bromog-backend:${{ github.sha }} -t bromog-backend:latest .

      - name: Roll the Container App to the new image
        run: |
          az containerapp update -g ${{ env.RESOURCE_GROUP }} -n ${{ env.APP_NAME }} \
            --image ${{ env.ACR_NAME }}.azurecr.io/bromog-backend:${{ github.sha }}
