name: Deploy backend

# Rebuilds the backend image in ACR and restarts the App Service on every push
# to main that touches the server. Initial infra is created by infra/deploy.sh.
#
# Required repo secrets:
#   AZURE_CREDENTIALS  - output of: az ad sp create-for-rbac --sdk-auth --role contributor \
#                          --scopes /subscriptions/<sub>/resourceGroups/<rg>
# Required repo variables (Settings → Secrets and variables → Actions → Variables):
#   RESOURCE_GROUP, ACR_NAME, APP_NAME

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "requirements.txt"
      - "Dockerfile"
      - "gunicorn.conf.py"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build image in ACR
        run: az acr build -r ${{ vars.ACR_NAME }} -t bromog-backend:${{ github.sha }} -t bromog-backend:latest .

      - name: Point web app at the new image and restart
        run: |
          az webapp config container set \
            -g ${{ vars.RESOURCE_GROUP }} -n ${{ vars.APP_NAME }} \
            --container-image-name ${{ vars.ACR_NAME }}.azurecr.io/bromog-backend:${{ github.sha }}
          az webapp restart -g ${{ vars.RESOURCE_GROUP }} -n ${{ vars.APP_NAME }}
